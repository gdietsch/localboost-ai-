name: Weekly Content Generation

on:
  schedule:
    # Every Sunday at 8:00 AM UTC
    - cron: '0 8 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    name: Generate Weekly Content
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly content generation
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Scheduler" \
            "https://localboost-ai-gabriels-projects-0b2bc794.vercel.app/api/scheduler/weekly-content"
      - name: Log result
        run: echo "Weekly content generation triggered at $(date)"